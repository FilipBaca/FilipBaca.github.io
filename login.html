<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Přihlaste se ke svému účtu ve Fitku na Hegerce.">
  <title>Přihlásit se — Fitko na Hegerce</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="navbar"></div>

  <main>
    <section class="section section--pt-3xl">
      <div class="container">
        <div class="form-wrapper fade-in">
          <div class="text-center mb-lg">
            <h1 class="form-heading">Přihlášení</h1>
            <p class="form-subtitle">
              Zadejte své přihlašovací údaje.
            </p>
          </div>

          <form method="POST" data-protect novalidate>
            <div class="form-group">
              <label for="login-email">E-mailová adresa</label>
              <input type="email" id="login-email" name="email" placeholder="vas@email.cz" required
                autocomplete="email">
            </div>

            <div class="form-group">
              <label for="login-password">Heslo</label>
              <div class="password-wrapper">
                <input type="password" id="login-password" name="password" placeholder="Zadejte heslo" required
                  autocomplete="current-password">
                <button type="button" class="password-toggle" aria-label="Zobrazit heslo">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn--primary btn--full" data-original-text="Přihlásit se">
              Přihlásit se
            </button>

            <p class="text-center mt-lg form-footer">
              Nemáte účet? <a href="registrace.html">Zaregistrujte se</a>
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="components.js"></script>
</body>

</html>
